name: Firmware build

on:
  push:
    branches: [main]
    paths: ["software/firmware/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["software/firmware/**", ".github/workflows/firmware.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('software/firmware/platformio.ini') }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - run: pio run
        working-directory: software/firmware
