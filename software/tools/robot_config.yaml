# robot_config.yaml - single source of truth for robot dimensions.
# ALL VALUES BELOW ARE PLACEHOLDERS. Replace them with real numbers once the
# CAD / servo choice is final; every script in this folder reads this file.

leg:
  l1_thigh_mm: 48         # hip servo axis -> knee servo axis
  l2_shank_mm: 55         # knee servo axis -> foot tip
  hip_limits_deg: [-90, 60]   # 0 = thigh pointing straight down, + = forward
  knee_max_deg: 160        # 0 = leg straight, bends up to this angle
  knee_bend: back          # back = knee points backward, front = forward

robot:
  mass_kg: 0.6             # total mass incl. battery
  stand_height_mm: 70      # hip axis height above ground in standing pose
  body_length_mm: 100      # front hip axis -> rear hip axis
  body_width_mm: 80        # left leg plane -> right leg plane
  cog_offset_x_mm: 0       # COG ahead (+) / behind (-) of body centre
  cog_lateral_mm: 0        # COG sideways offset (0 = centred)

stairs:
  step_height_mm: 30       # try 20 and 30
  step_depth_mm: 100        # tread depth
  num_steps: 3
  start_gap_mm: 20         # front feet distance before the first riser
  foot_edge_margin_mm: 10  # keep feet at least this far from a step edge

gait:
  swing_forward_mm: 25     # how far ahead the foot lands (relative to hip)
  step_clearance_mm: 10    # extra foot lift above the step edge
  body_advance_mm: 30      # body travel per 'push forward and up' phase
  max_cog_shift_mm: 40     # how far the body may slide over planted feet
  stability_margin_mm: 5   # COG must stay this far inside the support polygon
  frames_per_phase: 10     # animation resolution
  leg_order: front_rear    # front_rear = FR,FL | push | RR,RL (flowchart); diagonal = FR,RL | push | FL,RR

servo:
  model: "Surpass Hobby S0017M (17 g metal gear digital)"
  count: 8                 # 2 per leg x 4 legs
  weight_g: 21             # datasheet
  supply_v: 6.0            # operating range 4.8-6.0 V. NEVER connect 2S LiPo directly
  stall_torque_kgcm: 3.5   # datasheet: 3.2 at 4.8 V, 3.5 at 6 V (use the one for your rail)
  derate: 0.5              # use only this fraction of stall torque
  dynamic_factor: 1.5      # safety factor for motion / impact
  # stall current: NOT in the datasheet image - ask the seller (needed to size the buck)